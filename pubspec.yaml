name: ontorikkho
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
#iOS version
#version: 1.0.3+1

#android version
version: 1.0.8+1000080

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.3
  http: ^1.3.0
  google_fonts: ^8.0.2
  flutter_svg: ^2.0.17
  fl_chart: ^0.70.2
  flutter_launcher_icons: ^0.14.3
  intl_phone_field: ^3.2.0
  dropdown_search: ^6.0.2
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  video_player: ^2.9.5
  image_picker: ^1.1.2
  file_picker: ^10.2.0
  shimmer: ^3.0.0
  flutter_html: ^3.0.0
  url_launcher: ^6.3.1
  external_path: ^2.2.0
  flutter_easyloading: ^3.0.5
  open_file: ^3.5.10
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  flutter_native_splash: ^2.4.6
  hive: ^2.2.3
  hive_generator: ^2.0.1
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  lottie: ^3.3.2
  carousel_slider: ^5.1.1
  better_player_plus: ^1.1.2
  flutter_contacts_service: ^0.0.3
  package_info_plus: ^9.0.0
  app_links: ^6.4.1
  flutter_local_notifications: ^19.5.0
  firebase_messaging: ^16.1.0
  firebase_core: ^4.3.0
  visibility_detector: ^0.4.0+2
  flutter_facebook_auth: ^6.0.4
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  audioplayers: ^6.5.1
  uuid: ^4.5.2
  share_plus: ^12.0.1
  flutter_inappwebview: ^6.1.5
  any_link_preview: ^3.0.3
  emoji_picker_flutter: ^4.4.0
  giphy_picker: ^3.0.2
  video_thumbnail: ^0.5.6
  wechat_assets_picker: ^10.1.0
  photo_manager: ^3.8.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  #build_runner: ^2.5.
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  min_sdk_android: 21


flutter_native_splash:
  image: assets/icons/app_icon.png
  color: "#000000"       # splash screen background color
  android: true
  ios: true
  android_gravity: fill
  ios_content_mode: scale_to_fill


  android_12:
    color: "#000000"     # Android 12+ splash background color
    image: "assets/icons/app_icon.png" # Special logo for Android 12 (optional)

  web: false  # Web splash screen generation disabled

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/thumb/
    - assets/icons/
    - assets/logo/
    - assets/images/
    - assets/data/
    - assets/flags/
    - assets/animations/
    - assets/reactions/
    - assets/sounds/

